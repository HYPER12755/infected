name: Build Server

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm run build
      - name: Package npm bundle
        run: npm pack
      - name: Determine npm artifact name
        id: package-info
        run: echo "artifact_name=$(node -p \"const pkg=require('./package.json'); pkg.name.split('/').pop()+'-'+pkg.version+'.tgz'\")" >> $GITHUB_OUTPUT
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package-info.outputs.artifact_name }}
          path: ${{ steps.package-info.outputs.artifact_name }}
